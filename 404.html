<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到 | XUSN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        round: ['"Varela Round"', '"ZCOOL QingKe HuangYou"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                        display: ['"ZCOOL QingKe HuangYou"', '"Varela Round"', 'sans-serif'],
                    },
                    colors: {
                        cream: '#FDFBF7',
                        warm: {
                            50: '#FAF8F5',
                            100: '#F5F1EA',
                            200: '#E8E0D5',
                            800: '#5C4F42',
                            900: '#3D3429',
                        },
                        sage: {
                            100: '#E3ECE1',
                            200: '#C5D8C0',
                            500: '#7A9E77',
                            600: '#5E7A5A',
                        },
                        clay: {
                            100: '#F2E6E0',
                            200: '#E6CCBF',
                            500: '#C4956A',
                            600: '#A67B52',
                        }
                    },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FDFBF7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(226, 232, 220, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(242, 230, 224, 0.3) 0px, transparent 50%);
            color: #3D3429;
            font-family: 'Varela Round', 'ZCOOL QingKe HuangYou', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.04em;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        
        h1, h2, h3, .title-font {
            font-family: 'ZCOOL QingKe HuangYou', 'Varela Round', sans-serif;
            font-weight: 400;
        }
        
        .rounded-text {
            font-family: 'Varela Round', 'ZCOOL QingKe HuangYou', sans-serif;
        }
        
        .tag-rounded {
            font-family: 'ZCOOL QingKe HuangYou', sans-serif;
            letter-spacing: 0.05em;
        }
        
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(
                circle at var(--x, 50%) var(--y, 50%), 
                rgba(196, 149, 106, 0.08) 0%, 
                transparent 50%
            );
            z-index: 0;
        }

        /* 圆圈聚光灯动画 - 自适应大小 */
        .circle-spotlight {
            animation: pulse-glow 2s ease-in-out infinite;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .circle-spotlight::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196, 149, 106, 0.3) 0%, transparent 70%);
            filter: blur(8px);
            z-index: -1;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        .circle-spotlight:hover {
            transform: scale(1.1);
            background-color: rgba(196, 149, 106, 0.2);
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        /* 404数字动画 */
        .error-code {
            font-weight: 400;
            background: linear-gradient(135deg, #C4956A 0%, #5E7A5A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 10px 30px rgba(196, 149, 106, 0.2);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #C4956A 0%, #5E7A5A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 模糊背景装饰 */
        .blur-decor {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            z-index: -1;
        }

        /* 404数字自适应大小 */
        .error-code {
            font-size: 4rem; /* 移动端默认 */
        }
        
        @media (min-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
        }
        
        @media (min-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
        }
        
        @media (min-width: 1024px) {
            .error-code {
                font-size: 8rem;
            }
        }

        /* 按钮自适应大小 */
        .action-btn {
            padding: 0.75rem 1.25rem; /* 移动端 */
            font-size: 0.875rem; /* 移动端 */
        }
        
        @media (min-width: 768px) {
            .action-btn {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
        }

        /* 快速链接自适应 */
        .quick-link {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
        }
        
        @media (min-width: 768px) {
            .quick-link {
                padding: 0.75rem 1.25rem;
                font-size: 0.875rem;
            }
        }

        /* 圆圈按钮自适应大小 */
        .adaptive-spotlight {
            width: 48px;
            height: 48px;
        }
        
        @media (min-width: 480px) {
            .adaptive-spotlight {
                width: 56px;
                height: 56px;
            }
        }
        
        @media (min-width: 768px) {
            .adaptive-spotlight {
                width: 64px;
                height: 64px;
            }
        }
        
        @media (min-width: 1024px) {
            .adaptive-spotlight {
                width: 72px;
                height: 72px;
            }
        }

        /* 移动端优化：减少边距和间距 */
        .mobile-optimized .mb-4 { margin-bottom: 0.75rem; }
        .mobile-optimized .mb-6 { margin-bottom: 1rem; }
        .mobile-optimized .mb-8 { margin-bottom: 1.5rem; }
        .mobile-optimized .mb-10 { margin-bottom: 2rem; }
        .mobile-optimized .mb-12 { margin-bottom: 2.5rem; }
        .mobile-optimized .mt-8 { margin-top: 1.5rem; }
        .mobile-optimized .mt-12 { margin-top: 2.5rem; }
        .mobile-optimized .py-20 { padding-top: 3rem; padding-bottom: 3rem; }
        .mobile-optimized .pt-28 { padding-top: 2rem; }
        
        @media (min-width: 768px) {
            .mobile-optimized .mb-4 { margin-bottom: 1rem; }
            .mobile-optimized .mb-6 { margin-bottom: 1.5rem; }
            .mobile-optimized .mb-8 { margin-bottom: 2rem; }
            .mobile-optimized .mb-10 { margin-bottom: 2.5rem; }
            .mobile-optimized .mb-12 { margin-bottom: 3rem; }
            .mobile-optimized .mt-8 { margin-top: 2rem; }
            .mobile-optimized .mt-12 { margin-top: 3rem; }
            .mobile-optimized .py-20 { padding-top: 5rem; padding-bottom: 5rem; }
            .mobile-optimized .pt-28 { padding-top: 7rem; }
        }
    </style>
</head>
<body class="antialiased selection:bg-clay-200 selection:text-warm-900 min-h-screen flex flex-col mobile-optimized">

    <div class="spotlight" id="spotlight"></div>

    <!-- 导航栏 - 响应式 -->
    <nav class="fixed top-4 left-0 right-0 z-50 px-3 md:px-8">
        <div class="max-w-6xl mx-auto relative">
            <div class="glass-card rounded-full px-3 py-2 md:px-6 md:py-3 flex justify-between items-center">
                <a href="/" class="text-xl md:text-2xl title-font text-warm-900 hover:text-clay-600 transition-colors flex items-center gap-2 md:gap-3">
                    <div class="relative w-7 h-7 md:w-8 md:h-8 rounded-full overflow-hidden border-2 border-white shadow-md ring-2 ring-clay-200">
                        <img src="https://q1.qlogo.cn/g?b=qq&nk=2687821674&s=100" 
                             alt="XUSN" 
                             class="w-full h-full object-cover"
                             onerror="this.src='https://api.dicebear.com/7.x/avataaars/svg?seed=XUSN'">
                    </div>
                    <span class="hidden sm:inline tracking-widest text-sm md:text-lg">返回首页</span>
                </a>
                
                <a href="/" class="px-4 py-2 md:px-5 md:py-2 rounded-full bg-warm-800 text-white shadow-md hover:bg-warm-900 transition-all text-xs md:text-sm btn-text">
                    <i class="fas fa-home mr-1 md:mr-2"></i><span class="hidden sm:inline">首页</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="flex-1 flex items-center justify-center relative z-10 px-4 py-16 md:py-20">
        <!-- 装饰性背景元素 - 移动端隐藏 -->
        <div class="blur-decor w-48 h-48 md:w-96 md:h-96 bg-clay-200 top-1/3 left-1/4 hidden md:block"></div>
        <div class="blur-decor w-40 h-40 md:w-80 md:h-80 bg-sage-200 bottom-1/3 right-1/4 hidden md:block"></div>
        
        <div class="text-center max-w-md md:max-w-2xl mx-auto">
            <!-- 404 数字 -->
            <div class="error-code mb-3 md:mb-6">404</div>
            
            <!-- 标题 -->
            <h1 class="text-2xl md:text-4xl text-warm-900 mb-2 md:mb-4 title-font leading-tight">
                <span class="gradient-text">哎呀</span>，你好像迷路了
            </h1>
            
            <!-- 副标题 -->
            <p class="text-base md:text-lg text-warm-800/70 mb-6 md:mb-8 rounded-text leading-relaxed">
                这个页面暂时不存在，可能已经被移除或从未创建过。<br class="hidden md:block">
                别担心，我们可以带你回到安全的地方。
            </p>
            
            <!-- 一言显示区域 - 极简风格 -->
            <div class="mb-6 md:mb-10 px-3 py-2 md:px-4 md:py-3 rounded-xl bg-white/40 border border-white/60 inline-block">
                <p class="text-sm md:text-base text-warm-800/60 rounded-text italic" id="error-message">
                    "走错路是发现新风景的开始"
                </p>
            </div>
            
            <!-- 行动按钮 -->
            <div class="flex flex-col items-center gap-4 md:gap-6 mt-4 md:mt-8">
                <!-- 自适应圆圈聚光灯按钮 - 回到首页 -->
                <div class="flex flex-col items-center gap-2 md:gap-3">
                    <div class="circle-spotlight adaptive-spotlight rounded-full bg-clay-200/40" onclick="window.location.href='/'">
                        <i class="fas fa-home text-clay-600 text-lg md:text-xl"></i>
                    </div>
                    <span class="text-xs md:text-sm text-warm-800/60 rounded-text">回到首页</span>
                </div>
                
                <!-- 备用按钮 -->
                <div class="flex flex-col sm:flex-row gap-3 md:gap-4 mt-2 md:mt-0 w-full max-w-xs sm:max-w-none justify-center">
                    <a href="/" class="action-btn w-full sm:w-auto px-6 py-3 bg-warm-800 text-white rounded-full btn-text hover:bg-warm-900 transition-all hover:scale-105 shadow-lg text-center">
                        <i class="fas fa-home mr-2"></i>返回首页
                    </a>
                    <button onclick="history.back()" class="action-btn w-full sm:w-auto px-6 py-3 bg-white text-warm-800 rounded-full btn-text hover:bg-clay-100 transition-all hover:scale-105 border-2 border-warm-200 text-center">
                        <i class="fas fa-arrow-left mr-2"></i>返回上一页
                    </button>
                </div>
            </div>
            
            <!-- 快速链接 -->
            <div class="mt-8 md:mt-12 pt-6 md:pt-8 border-t border-warm-200/50">
                <p class="text-xs md:text-sm text-warm-800/50 mb-3 md:mb-4 rounded-text">或者浏览以下内容</p>
                <div class="flex flex-wrap justify-center gap-2 md:gap-3">
                    <a href="#about" class="quick-link px-4 py-2 bg-white/50 rounded-full text-warm-800 hover:bg-clay-100 transition-colors rounded-text border border-warm-100">
                        关于我
                    </a>
                    <a href="#skills" class="quick-link px-4 py-2 bg-white/50 rounded-full text-warm-800 hover:bg-clay-100 transition-colors rounded-text border border-warm-100">
                        技能
                    </a>
                    <a href="#projects" class="quick-link px-4 py-2 bg-white/50 rounded-full text-warm-800 hover:bg-clay-100 transition-colors rounded-text border border-warm-100">
                        作品
                    </a>
                    <a href="#contact" class="quick-link px-4 py-2 bg-white/50 rounded-full text-warm-800 hover:bg-clay-100 transition-colors rounded-text border border-warm-100">
                        联系
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 - 响应式 -->
    <footer class="border-t-2 border-warm-200 py-6 md:py-8 text-center text-warm-800/50 text-xs md:text-sm relative z-10 bg-warm-50/30">
        <div class="max-w-6xl mx-auto px-4 md:px-8">
            <p class="text-xl md:text-2xl text-warm-800 mb-1 md:mb-2 title-font">XUSN</p>
            <p class="mb-1 md:mb-2 rounded-text text-xs md:text-sm">用温柔的方式改变世界</p>
            <p class="text-xs opacity-60 rounded-text">&copy; 2026 XUSN. Made with 💛 and Code.</p>
        </div>
    </footer>

    <script>
        // 聚光灯跟随
        document.addEventListener('mousemove', (e) => {
            const spotlight = document.getElementById('spotlight');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            spotlight.style.setProperty('--x', `${x}%`);
            spotlight.style.setProperty('--y', `${y}%`);
        });

        // 随机错误提示语
        const errorMessages = [
            "你好像迷路了，但风景也不错",
            "这个页面可能正在休息",
            "404：页面在平行宇宙中",
            "别担心，导航会带你回家",
            "有时候迷路是计划外的冒险",
            "页面可能被藏起来了",
            "这里什么都没有，除了你的想象力",
            "错误代码：404 - 页面已度假",
            "你发现了一个隐藏区域！",
            "页面可能被星星带走了"
        ];

        // 随机显示一条提示
        function randomErrorMessage() {
            const messageEl = document.getElementById('error-message');
            const randomMsg = errorMessages[Math.floor(Math.random() * errorMessages.length)];
            messageEl.textContent = `"${randomMsg}"`;
        }

        // 页面加载时随机显示
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(randomErrorMessage, 1000);
        });

        // 平滑滚动到锚点
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // 添加页面加载动画
        document.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.querySelector('main');
            mainContent.style.opacity = '0';
            mainContent.style.transform = 'translateY(20px)';
            mainContent.style.transition = 'all 0.8s ease-out';
            
            setTimeout(() => {
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
            }, 300);
        });

        // 检测移动设备并调整样式
        function detectMobile() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                document.body.classList.add('mobile-optimized');
            }
        }
        
        document.addEventListener('DOMContentLoaded', detectMobile);
    </script>
</body>
</html>
